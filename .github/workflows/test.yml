name: Test

# macOS, because updater.sh uses the flags of macOS tar.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: for test in bin/*.test.sh; do sh "$test"; done
